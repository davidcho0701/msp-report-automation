# 고객사: SK엠앤서비스 (NCP VPC)
id: skmns
name: "SK엠앤서비스"
report_title: "UWS Cloud MSP 보고서"
template: templates/skmns_template.pptx
file_name: "{yy}년 {m}월 월간보고서_{yymm}01"   # 예: 26년 9월 월간보고서_260901

system_groups:
  - name: "LBS"
    servers:
      # 보고서 표기 순서 그대로
      - name: lbsbu02
        category: "운영"      # 구분 (API 에 없음)
        device_type: "VM"     # 디바이스 유형 (API 에 없음)
        disk_mount: "/data1"  # 성능현황 Top F/S 표기
        disk_device: "xvdb"   # 콘솔 CSV 의 (xvdb)DISK 컬럼
      - name: lbsbu01
        category: "운영"
        device_type: "VM"
        disk_mount: "/data1"
        disk_device: "xvdb"

# serverImageProductCode 의 일부 -> 보고서 OS 표기
os_mapping:
  "CNTOS.0708": "CentOS Linux 7.8-64"

backup:
  targets: [lbsbu01, lbsbu02]     # 백업 현황 표 순서
  frequency: "09:00 Daily"
  policy: "서버 이미지 수동 생성, 3일 보관 후 수동 삭제"
  # 작업결과 칸: 원본 보고서처럼 고정 문구로 내보낸다 (기본 빈칸).
  #   auto_judge: false -> 이미지 기록으로 판정하지 않고 fixed_result 를 그대로 사용 (점검 경고 없음)
  #   auto_judge: true  -> 매일 쌓은 스냅샷으로 누락 여부를 판정 (12월 보고서부터 가능)
  # 화면에서 서버별로 직접 지정한 값이 있으면 그것이 우선.
  auto_judge: false
  fixed_result: ""

# Cloud Insight 성능 지표 (2026-11 API 로 검증)
# - Min30 + AVG 집계: 콘솔 CSV(30분 간격)와 CPU/메모리/SWAP 값이 정확히 일치. 월 전체 시계열의 최대/평균.
# - 기존 9월 보고서 값은 어느 간격으로도 재현되지 않음 (특히 lbsbu01 은 전 간격에서 불일치).
# - 디스크: 기존 보고서/CSV 와 같은 DISK/used_rto (장치 xvdb). fs_usert(/data1) 는 데이터 없음.
# - 보존: Min5 1개월, Min30 3개월 (매월 19일 전월 조회 기준 둘 다 가능)
performance:
  product_name: "System/Server(VPC)"
  interval: Min30
  aggregation: AVG
  metrics:
    cpu:  {metric: avg_cpu_used_rto}
    mem:  {metric: mem_usert}
    swap: {metric: swap_usert}
    disk: {metric: used_rto, dimensions: {disk_idx: "{disk_device}"}}

thresholds:
  cpu_pct: 80
  mem_pct: 80
  disk_pct: 85
